[project]
name = "payment-api"
version = "0.1.0"
description = "KUROKO payment-api: AP2 の委任状の署名・検証、Policy Gate 6.3、振込依頼の管理"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "google-auth>=2.58.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-kms>=3.0",
    "pydantic-settings>=2.5",
    # AP2 の公式 SDK は PyPI 未公開。コミットは uv.lock が固定する
    "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@main",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
