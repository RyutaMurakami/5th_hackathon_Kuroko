<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141d2e"/></marker></defs><rect width="1600" height="1010" fill="#ffffff"/><text x="40" y="44" font-size="24" font-weight="700" fill="#141d2e" text-anchor="start">KUROKO — システム構成図（Google Cloud）</text><text x="40" y="70" font-size="13.5" font-weight="400" fill="#5a6478" text-anchor="start">AI（Gemini）は、聞く・探す・調べる・説明するだけ。金額の計算・検査・署名・振込は、Cloud Run のコードと本人の操作が担う。</text><rect x="40" y="130" width="200" height="84" rx="12" fill="#fff3d6" stroke="#141d2e" stroke-width="1.5"/><text x="52" y="154" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">幹事・審査員</text><text x="52" y="174" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">ブラウザ（Web）</text><text x="52" y="191" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">依頼・確認・アップロード</text><rect x="40" y="300" width="200" height="84" rx="12" fill="#fff3d6" stroke="#141d2e" stroke-width="1.5"/><text x="52" y="324" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">参加者・承認者</text><text x="52" y="344" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">Slack（DM のボタン）</text><text x="52" y="361" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">出欠・委任・承認</text><rect x="40" y="800" width="200" height="84" rx="12" fill="#f1f2f5" stroke="#5a6478" stroke-width="1.5"/><text x="52" y="824" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">GitHub Actions</text><text x="52" y="844" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">CI ／ main へのマージで</text><text x="52" y="861" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">デプロイ（WIF。鍵なし）</text><rect x="280" y="96" width="1040" height="884" rx="20" fill="#fbf9f4" stroke="#c9ccd4" stroke-width="1.5"/><text x="300" y="122" font-size="15" font-weight="700" fill="#5a6478" text-anchor="start">Google Cloud（kuroko-509311 / us-central1）</text><rect x="300" y="140" width="300" height="250" rx="16" fill="#eef1f7" stroke="#c9ccd4" stroke-width="1.5"/><text x="316" y="166" font-size="15" font-weight="700" fill="#141d2e" text-anchor="start">入口</text><rect x="316" y="176" width="268" height="64" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="328" y="200" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Firebase Hosting ＋ Auth</text><text x="328" y="220" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">Web の配信・Google ログイン</text><rect x="316" y="252" width="268" height="60" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="328" y="276" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">kuroko-dashboard</text><text x="328" y="296" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">Cloud Run（公開）・Next.js</text><rect x="316" y="322" width="268" height="58" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="328" y="346" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">kuroko-gateway</text><text x="328" y="366" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">Cloud Run（公開）・署名の検証だけ</text><rect x="300" y="410" width="300" height="150" rx="16" fill="#eef1f7" stroke="#c9ccd4" stroke-width="1.5"/><text x="316" y="436" font-size="15" font-weight="700" fill="#141d2e" text-anchor="start">非同期</text><rect x="316" y="442" width="268" height="52" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="328" y="466" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Cloud Tasks</text><text x="328" y="486" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">Slack の操作・請求・振り返りの受け渡し</text><rect x="316" y="500" width="268" height="52" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="328" y="524" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Cloud Scheduler</text><text x="328" y="544" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">銀行の承認・入金の確認（1分ごと）</text><rect x="620" y="140" width="320" height="420" rx="16" fill="#e0f8f3" stroke="#c9ccd4" stroke-width="1.5"/><text x="636" y="166" font-size="15" font-weight="700" fill="#141d2e" text-anchor="start">業務のコード（Cloud Run・非公開）</text><rect x="636" y="176" width="288" height="132" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="648" y="200" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">kuroko-api</text><text x="648" y="220" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">按分・Policy Gate・請求の署名</text><text x="648" y="237" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">振り返り・記憶の読み書き</text><text x="648" y="254" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">規程・予約・領収書の読み取り</text><text x="648" y="271" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">エージェント用のツール（MCP 4つ）</text><rect x="636" y="322" width="288" height="100" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="648" y="346" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">payment-api</text><text x="648" y="366" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">AP2 の委任状の署名と検証</text><text x="648" y="383" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">Policy Gate・振込の依頼</text><text x="648" y="400" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">入金の確認・領収書の署名</text><rect x="636" y="436" width="288" height="108" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="648" y="460" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">bank-adapter</text><text x="648" y="480" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">銀行 API の窓口</text><text x="648" y="497" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">口座とトークンは、ここだけ</text><text x="648" y="514" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">デモ用の振込の代行</text><rect x="960" y="140" width="340" height="420" rx="16" fill="#fff3d6" stroke="#c9ccd4" stroke-width="1.5"/><text x="976" y="166" font-size="15" font-weight="700" fill="#141d2e" text-anchor="start">Agent Platform（AI）</text><rect x="1004" y="176" width="280" height="62" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="1016" y="200" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Agent Gateway ＋ Model Armor</text><text x="1016" y="220" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">エージェントの入口・出口を検査</text><rect x="1004" y="250" width="280" height="62" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="1016" y="274" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">kuroko-agent（Agent Runtime）</text><text x="1016" y="294" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">統括エージェント（ADK・Gemini）</text><rect x="1004" y="324" width="280" height="62" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="1016" y="348" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">extract-agent（Agent Runtime）</text><text x="1016" y="368" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">自由記述を語彙に落とす・ツールなし</text><rect x="1004" y="398" width="280" height="62" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="1016" y="422" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Memory Bank</text><text x="1016" y="442" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">チームの宴会実績（定型の文だけ）</text><rect x="1004" y="472" width="134" height="74" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="1016" y="496" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Agent Registry</text><text x="1016" y="516" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">ツールの名簿</text><rect x="1150" y="472" width="134" height="74" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="1162" y="496" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Gemini</text><text x="1162" y="516" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">Vertex AI</text><rect x="300" y="580" width="1000" height="150" rx="16" fill="#eef1f7" stroke="#c9ccd4" stroke-width="1.5"/><text x="316" y="606" font-size="15" font-weight="700" fill="#141d2e" text-anchor="start">データ・鍵（実行用のサービスアカウントごとに権限を分ける）</text><rect x="316" y="616" width="228" height="100" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="328" y="640" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Firestore（default）</text><text x="328" y="660" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">イベント・参加者・按分・承認</text><text x="328" y="677" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">支払い・振り返り・経緯</text><rect x="556" y="616" width="176" height="100" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="568" y="640" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Firestore（bank）</text><text x="568" y="660" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">口座の対応表</text><text x="568" y="677" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">bank-adapter だけ</text><rect x="744" y="616" width="176" height="100" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="756" y="640" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Cloud Storage</text><text x="756" y="660" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">予約画面・領収書</text><text x="756" y="677" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">（署名付き URL）</text><rect x="932" y="616" width="176" height="100" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="944" y="640" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Cloud KMS</text><text x="944" y="660" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">請求・委任状の</text><text x="944" y="677" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">署名鍵</text><rect x="1120" y="616" width="164" height="100" rx="12" fill="#ffffff" stroke="#141d2e" stroke-width="1.5"/><text x="1132" y="640" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Secret Manager</text><text x="1132" y="660" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">Slack・地図・銀行の</text><text x="1132" y="677" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">キーとトークン</text><rect x="300" y="750" width="1000" height="210" rx="16" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.5"/><text x="316" y="776" font-size="15" font-weight="700" fill="#141d2e" text-anchor="start">役割の境界（これ自体が、いちばんの安全策）</text><text x="320" y="800" font-size="13.5" font-weight="400" fill="#141d2e" text-anchor="start">・AI が決めないもの: 金額の計算、承認者、支払先、規程の値、委任状への署名、店の順位、振込の作成、「完了」の判断</text><text x="320" y="827" font-size="13.5" font-weight="400" fill="#141d2e" text-anchor="start">・AI が見ないもの: 実名、口座番号、銀行のトークン、署名鍵、個人ごとの回答</text><text x="320" y="854" font-size="13.5" font-weight="400" fill="#141d2e" text-anchor="start">・請求する側（kuroko-api）と支払う側（payment-api）が、互いを信用せず、別々に検査する（Policy Gate）</text><text x="320" y="881" font-size="13.5" font-weight="400" fill="#141d2e" text-anchor="start">・お金を動かす最後の一押しは、口座の持ち主が銀行で行う。完了にするのは、銀行の明細で入金を確認できたときだけ</text><text x="320" y="908" font-size="13.5" font-weight="400" fill="#141d2e" text-anchor="start">・記憶に入るのは、幹事が確かめた、決まった形の文だけ。規程は、エージェントがツールで条ごとに調べる（全文は渡さない）</text><text x="320" y="935" font-size="13.5" font-weight="400" fill="#141d2e" text-anchor="start">・エージェントのツールは4つ（イベントの概要・予算の確認・店の検索・規程の検索）。お金・承認・署名のツールは無い</text><rect x="1360" y="176" width="200" height="100" rx="12" fill="#f1f2f5" stroke="#5a6478" stroke-width="1.5"/><text x="1372" y="200" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">駅すぱあと</text><text x="1372" y="220" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">全員が帰りやすい駅</text><text x="1372" y="237" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">（所要時間の検索）</text><rect x="1360" y="300" width="200" height="84" rx="12" fill="#f1f2f5" stroke="#5a6478" stroke-width="1.5"/><text x="1372" y="324" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">Google Maps</text><text x="1372" y="344" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">店の検索</text><text x="1372" y="361" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">（Places API）</text><rect x="1360" y="436" width="200" height="108" rx="12" fill="#f1f2f5" stroke="#5a6478" stroke-width="1.5"/><text x="1372" y="460" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">sunabar</text><text x="1372" y="480" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">GMOあおぞらネット銀行の</text><text x="1372" y="497" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">銀行 API（実験用の環境）</text><text x="1372" y="514" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">振込依頼・本人承認・明細</text><rect x="1360" y="616" width="200" height="100" rx="12" fill="#fff3d6" stroke="#141d2e" stroke-width="1.5"/><text x="1372" y="640" font-size="14.5" font-weight="700" fill="#141d2e" text-anchor="start">参加者（口座の持ち主）</text><text x="1372" y="660" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">銀行のサイトで、</text><text x="1372" y="677" font-size="12" font-weight="400" fill="#5a6478" text-anchor="start">振込ごとに承認する</text><line x1="240" y1="172" x2="316" y2="200" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="276" y="174" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">HTTPS</text><line x1="450" y1="240" x2="450" y2="252" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><line x1="584" y1="282" x2="636" y2="250" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="606" y="256" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">API</text><line x1="240" y1="342" x2="316" y2="350" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="278" y="334" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">ボタン操作</text><line x1="450" y1="380" x2="450" y2="442" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><line x1="584" y1="468" x2="636" y2="296" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="606" y="420" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">OIDC</text><line x1="584" y1="526" x2="636" y2="404" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="606" y="500" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">定期</text><line x1="780" y1="308" x2="780" y2="322" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="852" y="319" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">請求（署名つき）</text><line x1="780" y1="422" x2="780" y2="436" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="836" y="433" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">振込の依頼</text><line x1="924" y1="204" x2="1004" y2="204" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="964" y="198" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">依頼</text><line x1="1144" y1="238" x2="1144" y2="250" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><polyline points="1004,290 964,290 964,250 924,250" fill="none" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="968" y="243" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">ツール（MCP）</text><line x1="924" y1="280" x2="1004" y2="352" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="972" y="344" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">抽出</text><line x1="924" y1="296" x2="1004" y2="428" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="972" y="412" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">記憶</text><polyline points="860,176 860,131 1340,131 1340,226 1360,226" fill="none" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="1100" y="127" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">外部 API（駅・地図）。キーは Secret Manager</text><polyline points="1340,226 1340,342 1360,342" fill="none" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><polyline points="924,520 944,520 944,570 1340,570 1340,490 1360,490" fill="none" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="1140" y="566" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">振込依頼・承認の状況・明細の照会</text><line x1="1460" y1="616" x2="1460" y2="544" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="1486" y="586" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">承認</text><line x1="780" y1="544" x2="780" y2="616" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><line x1="240" y1="842" x2="300" y2="842" stroke="#141d2e" stroke-width="1.8" marker-end="url(#a)"/><text x="270" y="832" font-size="11.5" fill="#5a6478" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">デプロイ</text></svg>