<title>KUROKO 歓送迎会ストーリー</title>
<meta name="description" content="SPEC.mdをもとに、Slack・App Home・Webダッシュボード・銀行の承認画面・経費精算PDFを実際の画面のイメージで並べたモック">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F5F6F8;--surface:#FFFFFF;--subtle:#F9FAFB;--border:#E4E7EC;--border-2:#F0F2F5;
  --text:#101828;--text-2:#344054;--muted:#667085;--faint:#98A2B3;
  --accent:#2F6FED;--accent-hover:#2559C7;--accent-soft:#EEF4FF;--accent-text:#1F4FB8;
  --ok:#12B76A;--ok-text:#067647;--ok-soft:#ECFDF3;
  --warn:#F79009;--warn-text:#B54708;--warn-soft:#FFFAEB;
  --bad:#F04438;--bad-text:#B42318;--bad-soft:#FEF3F2;
  --violet-text:#5B3FC4;--violet-soft:#F4F0FF;
  --teal-text:#0E7490;--teal-soft:#ECFBFF;
  --orange-text:#C4320A;--orange-soft:#FFF4ED;
  --sk-aub:#3F0E40;--sk-aub-dark:#2C0A2D;--sk-side-text:#D8CCD8;--sk-active:#1164A3;
  --sk-text:#1D1C1D;--sk-muted:#616061;--sk-border:#E2E2E2;--sk-green:#007A5A;--sk-link:#1264A3;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px -8px rgba(16,24,40,.12);
  --f:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  --f-slack:Lato,"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}

/* ---------- top bar & layout ---------- */
.topbar{position:sticky;top:0;z-index:20;height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;padding-inline:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;border-radius:7px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brand b{font-size:16px;letter-spacing:.02em}
.brand .sep{width:1px;height:18px;background:var(--border)}
.brand .name{color:var(--text-2);font-weight:500;white-space:nowrap}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:500;white-space:nowrap}
.tb-note{font-size:12px;color:var(--muted);white-space:nowrap}
@media(max-width:760px){.tb-note{display:none}}
@media(max-width:480px){.brand .badge{display:none}}
.layout{display:grid;grid-template-columns:264px minmax(0,1fr)}
.side{position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px 32px}
.nav-g{margin:20px 8px 4px;font-size:11.5px;font-weight:700;color:var(--faint);letter-spacing:.06em}
.nav-g:first-child{margin-top:0}
.nav-sub{margin:10px 8px 2px;font-size:11.5px;color:var(--muted)}
.nav-i{width:100%;display:flex;align-items:center;gap:8px;padding:5px 8px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;font-size:13px;color:var(--text-2)}
.nav-i:hover{background:var(--subtle)}
.nav-i[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:500}
.nav-i .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);width:18px;flex:none}
.nav-i[aria-current="page"] .n{color:var(--accent)}
.nav-i .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stag{flex:none;font-size:10.5px;padding:0 6px;border-radius:4px;border:1px solid var(--border);color:var(--muted);line-height:18px;white-space:nowrap;background:var(--surface)}
.stag.br{color:var(--warn-text);border-color:#FEDF89;background:var(--warn-soft)}
.main{min-width:0;padding:24px clamp(16px,3vw,36px) 72px}
.mnav{display:none;margin-bottom:16px}
.mnav label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.mnav select{width:100%;height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px}
@media(max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}.side{display:none}.mnav{display:block}}

/* ---------- page header ---------- */
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin:6px 0 20px}
.ph h1{margin:0;font-size:22px;line-height:1.4;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--text-2);max-width:70ch}
.ph-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.pager{display:flex;align-items:center;gap:8px}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--text-2)}
button.btn:hover{background:var(--subtle)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.sec-t{font-size:15px;font-weight:700;margin:32px 0 12px}
.hint{font-size:12.5px;color:var(--muted)}

/* ---------- story layout ---------- */
.story{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media(max-width:1300px){.story{grid-template-columns:minmax(0,1fr)}}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
@media(max-width:1300px) and (min-width:760px){.panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:0}
.card-h{padding:10px 14px;border-bottom:1px solid var(--border-2);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-b{padding:12px 14px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13px}
.steps li{display:grid;grid-template-columns:68px minmax(0,1fr);gap:8px;align-items:baseline}
.tg{display:inline-block;text-align:center;font-size:11px;font-weight:500;border-radius:4px;padding:0 6px;line-height:20px;white-space:nowrap}
.tg-p{background:var(--orange-soft);color:var(--orange-text)}
.tg-j{background:var(--violet-soft);color:var(--violet-text)}
.tg-t{background:var(--accent-soft);color:var(--accent-text)}
.tg-g{background:var(--ok-soft);color:var(--ok-text)}
.tg-s{background:#F2F4F7;color:var(--text-2)}
.tg-b{background:var(--bad-soft);color:var(--bad-text)}
.tg-r{background:#F2F4F7;color:var(--muted)}
.tg-w{background:var(--warn-soft);color:var(--warn-text)}
.tg-h{background:var(--teal-soft);color:var(--teal-text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.code-chip{font-family:var(--f-mono);font-size:11.5px;background:#F2F4F7;border-radius:4px;padding:1px 6px;color:var(--text-2);overflow-wrap:anywhere}
.key{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ok-text);background:var(--ok-soft);border-radius:6px;padding:1px 8px}
.note{display:flex;gap:8px;font-size:12.5px;line-height:1.6;color:var(--warn-text);background:var(--warn-soft);border:1px solid #FEDF89;border-radius:8px;padding:9px 11px}
.note.info{color:var(--accent-text);background:var(--accent-soft);border-color:#C7D7FE}
.note .ic{margin-top:2px}
.sublabel{font-size:12px;color:var(--muted);margin:12px 0 6px}
.sublabel:first-child{margin-top:0}
.rows{display:flex;flex-direction:column;gap:7px;font-size:13px}
.rows>div{display:flex;justify-content:space-between;gap:12px}
.rows>div>span:first-child{color:var(--muted)}
.rows>div>span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.rows .total{border-top:1px solid var(--border-2);padding-top:7px;font-weight:700}
.gate{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.gate li{display:flex;gap:8px;align-items:flex-start}
.gate .ic{color:var(--ok);margin-top:3px}
.sel{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:4px;font-size:13px}
.sel li{counter-increment:s;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:6px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--muted)}
.sel li::before{content:counter(s);font-family:var(--f-mono);font-size:11px}
.sel li.hit{background:var(--ok-soft);color:var(--ok-text);font-weight:500}
.sel li span{font-size:12px}

/* ---------- Slack imitation ---------- */
.sk{position:relative;background:#fff;border:1px solid #D5D5D5;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-family:var(--f-slack);color:var(--sk-text)}
.sk-top{height:38px;background:var(--sk-aub-dark);display:flex;align-items:center;gap:12px;padding-inline:12px}
.lights{display:flex;gap:7px;flex:none}
.lights i{width:11px;height:11px;border-radius:50%;background:#FF5F57}
.lights i:nth-child(2){background:#FEBC2E}
.lights i:nth-child(3){background:#28C840}
.sk-search{flex:1;max-width:520px;margin-inline:auto;height:24px;border-radius:6px;background:rgba(255,255,255,.16);color:rgba(255,255,255,.85);font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.sk-body{display:grid;grid-template-columns:74px 230px minmax(0,1fr);height:680px}
.sk-rail{background:var(--sk-aub-dark);display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px}
.ws{width:36px;height:36px;border-radius:8px;background:#fff;color:var(--sk-aub);display:grid;place-items:center;font-weight:700;font-size:15px;font-family:var(--f);box-shadow:0 0 0 2px var(--sk-aub-dark),0 0 0 4px rgba(255,255,255,.55);margin-bottom:4px}
.rail-i{display:flex;flex-direction:column;align-items:center;gap:2px;color:#EDE3ED;font-size:9.5px;white-space:nowrap}
.rail-i span{width:36px;height:32px;border-radius:8px;display:grid;place-items:center}
.rail-i.on span{background:rgba(255,255,255,.22)}
.sk-side{background:var(--sk-aub);color:var(--sk-side-text);padding:8px;overflow:hidden;font-size:14.5px}
.sk-ws{display:flex;align-items:center;gap:4px;color:#fff;font-weight:900;font-size:17px;padding:6px 10px 8px}
.sk-sec{display:flex;align-items:center;gap:6px;padding:12px 10px 2px;font-size:14px}
.sk-it{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 16px;border-radius:6px;white-space:nowrap;overflow:hidden}
.sk-it .h{width:16px;text-align:center;opacity:.85;flex:none}
.sk-it.on{background:var(--sk-active);color:#fff}
.sk-it.unread{color:#fff;font-weight:900}
.sk-it .cnt{margin-left:auto;background:#CD2553;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:0 6px;line-height:18px}
.sk-it .me{opacity:.7;font-weight:400}
.sk-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.sk-head{flex:none;height:50px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-inline:16px}
.sk-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;min-width:0;white-space:nowrap}
.sk-members{display:flex;align-items:center;gap:4px;border:1px solid var(--sk-border);border-radius:6px;padding:2px 8px 2px 3px;font-size:12.5px;color:var(--sk-muted)}
.sk-members .av{margin-left:-6px;box-shadow:0 0 0 2px #fff}
.sk-members .av:first-child{margin-left:0}
.sk-tabs{flex:none;display:flex;gap:18px;padding-inline:16px;border-bottom:1px solid var(--sk-border);font-size:13px;color:var(--sk-muted)}
.sk-tabs span{padding:4px 2px 8px;border-bottom:2px solid transparent}
.sk-tabs span.on{color:var(--sk-text);font-weight:700;border-color:var(--sk-text)}
.sk-feed{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:8px}
.sk-feed::before{content:"";margin-top:auto}
.sk-feed.home::before{display:none}
.sk-day{position:relative;display:flex;justify-content:center;margin:14px 0 6px}
.sk-day::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--sk-border)}
.sk-day span{position:relative;background:#fff;border:1px solid var(--sk-border);border-radius:24px;padding:0 14px;font-size:13px;font-weight:700;line-height:26px}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:8px 20px}
.msg:hover{background:#F8F8F8}
.msg-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 6px;line-height:1.4}
.msg-h b{font-weight:900;font-size:15px}
.app-tag{font-size:10px;font-weight:700;background:rgba(29,28,29,.08);color:var(--sk-muted);border-radius:3px;padding:1px 4px}
.msg-h time{font-size:12px;color:var(--sk-muted)}
.msg-t{font-size:15px;line-height:1.47}
.edited{font-size:12px;color:var(--sk-muted)}
.av{--s:36px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .2);display:inline-grid;place-items:center;font-family:var(--f);font-weight:700;font-size:calc(var(--s) * .42);flex:none;line-height:1}
.av-k{background:#111827;color:#fff}
.bk{display:flex;flex-direction:column;gap:8px;margin-top:4px;max-width:600px;font-size:15px;line-height:1.47}
.bk-header{font-size:18px;font-weight:900;line-height:1.35;margin-top:2px}
.bk-text{min-width:0}
.bk-text ul{margin:2px 0;padding-left:1.2em}
.bk-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.bk-fields b{display:block;font-weight:900}
.bk-context{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--sk-muted)}
.bk-divider{border:0;border-top:1px solid var(--sk-border);margin:4px 0;width:100%}
.bk-actions{display:flex;flex-wrap:wrap;gap:8px}
.bk-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border:1px solid rgba(29,28,29,.3);border-radius:6px;background:#fff;font-size:13.5px;font-weight:700;white-space:nowrap;color:var(--sk-text)}
.bk-btn.primary{background:var(--sk-green);border-color:var(--sk-green);color:#fff}
.bk-acc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.bk-select{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid rgba(29,28,29,.3);border-radius:6px;font-size:14px;background:#fff;white-space:nowrap}
.bk-thumb{width:72px;height:72px;border-radius:8px;flex:none;display:block}
.bk-quote{border-left:4px solid #DDDDDD;padding-left:10px}
.bk-link{color:var(--sk-link)}
.sk .muted{color:var(--sk-muted);font-size:13.5px}
.bk-file{display:flex;align-items:center;gap:10px;border:1px solid var(--sk-border);border-radius:10px;padding:10px 12px;max-width:440px;background:#fff}
.pdf-ic{width:36px;height:42px;border-radius:6px;background:#E5484D;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900;flex:none}
.bk-file b{display:block;font-size:14px;overflow-wrap:anywhere}
.bk-file small{display:block;color:var(--sk-muted);font-size:12.5px}
.bk-img-name{font-size:12.5px;color:var(--sk-muted);display:flex;align-items:center;gap:4px;margin:4px 0}
.bk-img{border:1px solid var(--sk-border);border-radius:8px;overflow:hidden;max-width:360px}
.bk-table{border-collapse:collapse;font-size:14px;width:100%;max-width:440px}
.bk-table th,.bk-table td{border:1px solid var(--sk-border);padding:4px 10px;text-align:left}
.bk-table th{background:#F8F8F8;font-weight:700}
.bk-table .r{text-align:right;font-variant-numeric:tabular-nums}
.thread{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px}
.thread b{color:var(--sk-link);font-weight:700}
.thread span{color:var(--sk-muted)}
.reacts{display:flex;gap:4px;margin-top:6px}
.react{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;background:#F2F2F2;font-size:12px;border:1px solid transparent}
.react.mine{background:#E8F5FA;border-color:#1D9BD1;color:var(--sk-link)}
.sk-compose{flex:none;margin:0 20px 16px;border:1px solid #BCBCBC;border-radius:8px;font-size:14px}
.sk-compose .tb{display:flex;gap:14px;padding:5px 10px;color:#9A9A9A;font-weight:700;font-size:13px;background:#F8F8F8;border-radius:8px 8px 0 0}
.sk-compose .cph{padding:8px 12px;color:#9A9A9A}
.sk-compose .bt{display:flex;justify-content:space-between;align-items:center;padding:2px 8px 6px;color:#9A9A9A}
.sk-compose .send{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;background:#F0F0F0;color:#BBBBBB}
.home{padding:20px 24px 28px;display:flex;flex-direction:column;gap:12px;max-width:700px}
.hl{display:flex;flex-direction:column;border:1px solid var(--sk-border);border-radius:8px;overflow:hidden;max-width:560px}
.hl>div{display:grid;grid-template-columns:minmax(0,1fr) auto 170px;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid var(--sk-border);font-size:14px}
.hl>div:first-child{border-top:0}
.hl .who-s{display:flex;align-items:center;gap:8px;min-width:0}
.hl .r{text-align:right;font-variant-numeric:tabular-nums}
.hl .wait{color:#B54708}
.scrim{position:absolute;inset:0;background:rgba(29,28,29,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal{width:min(520px,100%);max-height:100%;background:#fff;border-radius:10px;display:flex;flex-direction:column;box-shadow:0 18px 48px rgba(0,0,0,.35);overflow:hidden}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--sk-border)}
.modal-h b{font-size:20px;font-weight:900;flex:1}
.modal-b{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--sk-border)}
.fl{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.fl>b{font-weight:900}
.fl>b span{font-weight:400;color:var(--sk-muted);font-size:13px}
.fin{height:36px;border:1px solid rgba(29,28,29,.3);border-radius:6px;padding:0 10px;display:flex;align-items:center}
.opt{display:flex;align-items:center;gap:8px}
.radio{width:16px;height:16px;border-radius:50%;border:1px solid #9A9A9A;flex:none}
.radio.on{border:5px solid var(--sk-link)}
.cbox{width:16px;height:16px;border-radius:4px;border:1px solid #9A9A9A;flex:none;display:grid;place-items:center;font-size:11px}
.cbox.on{background:var(--sk-link);border-color:var(--sk-link);color:#fff}
.sk-hint{font-size:13px;color:var(--sk-muted)}
.linked{display:flex;align-items:center;gap:8px;border:1px solid var(--sk-border);border-radius:8px;padding:8px 10px;font-size:14px}
.linked .okk{color:var(--sk-green);font-weight:700;margin-left:auto;white-space:nowrap}
.explain-box{background:#F8F8F8;border-radius:6px;padding:10px 12px;font-size:14px}
.shot{background:#fff;padding:12px 14px;font-size:13px;font-family:var(--f)}

/* ================= pages ================= */
function panel(s){
  return `<div class="panel">
    <div class="card"><div class="card-h">この場面</div><div class="card-b"><dl class="kv"><dt>見ている人</dt><dd>${s.who}</dd><dt>画面</dt><dd>${s.where}</dd><dt>日時</dt><dd>${s.when}</dd></dl></div></div>
    <div class="card"><div class="card-h">KUROKO の裏側の処理</div><div class="card-b"><ol class="steps">${s.steps.map(([t,x])=>`<li><span class="tg tg-${TG[t]}">${t}</span><span>${x}</span></li>`).join('')}</ol></div></div>
    ${s.extra||''}
    <div class="card"><div class="card-h">参照${s.key?`<span class="key">${I('shield',13)}${s.key}</span>`:''}</div><div class="card-b">
      <div class="sublabel">会社規程</div><div class="chips">${s.pol.length?s.pol.map(p=>`<span class="code-chip">${p}</span>`).join(''):'<span class="hint">なし</span>'}</div>
      <div class="sublabel">SPEC.md</div><div class="chips">${s.spec.map(x=>`<span class="code-chip">${x}</span>`).join('')}</div>
    </div></div>
    ${(s.notes||[]).map(([k,t])=>`<div class="note${k==='info'?' info':''}">${I('info',16)}<span>${t}</span></div>`).join('')}
  </div>`;
}

function storyPage(i){
  const s=SC[i];
  const prev=i>0?'s'+pad(i):'', next=i<SC.length-1?'s'+pad(i+2):'';
  return `<div class="crumbs"><span>ストーリー</span><span>›</span><span>${s.phase}</span></div>
  <div class="ph">
    <div><h1>${pad(i+1)}. ${s.title}</h1><p>${s.desc}</p>
      <div class="ph-tags"><span class="stag">${s.surface}</span>${s.branch?'<span class="stag br">分岐（予算超過時のみ）</span>':''}</div></div>
    <div class="pager"><button class="btn" ${prev?`data-go="${prev}"`:'disabled'}>← 前へ</button><span class="count">${i+1} / ${SC.length}</span><button class="btn primary" ${next?`data-go="${next}"`:'disabled'}>次へ →</button></div>
  </div>
  <div class="story"><div style="min-width:0">${s.view()}</div>${panel(s.side)}</div>`;
}

function screenPage(crumb,title,desc,html){
  return `<div class="crumbs"><span>画面一覧</span><span>›</span><span>${crumb}</span></div>
  <div class="ph"><div><h1>${title}</h1><p>${desc}</p></div></div>${html}`;
}

function overview(){
  let ph='';
  const rows=SC.map((s,i)=>{
    let h='';
    if(s.phase!==ph){ph=s.phase;h+=`<tr class="phase-row"><td colspan="4">${ph}</td></tr>`;}
    return h+`<tr><td class="nowrap" style="font-family:var(--f-mono);color:var(--muted)">${pad(i+1)}</td><td><button class="linkbtn" data-go="s${pad(i+1)}">${s.title}</button>${s.branch?' <span class="stag br">分岐</span>':''}</td><td class="nowrap">${s.side.who}</td><td><span class="stag">${s.surface}</span></td></tr>`;
  }).join('');
  const type=(bg,fg,ic,t,d,go)=>`<div class="type"><span class="ti" style="background:${bg};color:${fg}">${I(ic,18)}</span><b>${t}</b><p>${d}</p><button class="btn sm" data-go="${go}">開く →</button></div>`;
  return `<div class="crumbs"><span>KUROKO 画面モック</span></div>
  <div class="ph"><div><h1>KUROKO 画面モック</h1><p>SPEC.md（2026-09-17）をもとに、実際に開発した場合の画面をイメージしたモックです。Slackでのやり取りを中心に、App Home・Webダッシュボード・銀行の承認画面・経費精算PDFまでを並べています。ボタンは動作しません。</p></div>
  <button class="btn primary" data-go="s01">ストーリーを最初から見る →</button></div>
  <div class="sec-t" style="margin-top:8px">画面の種類</div>
  <div class="types">
    ${type('#F4EBF4','#3F0E40','chat','Slack DM・チャンネル','通知と個別のやり取り。出欠、按分の結果、支払いのお願いなど。','s01')}
    ${type('#F4EBF4','#3F0E40','home','Slack App Home','承認の主な入口。承認待ち・自分の支払い・幹事向けの進行状況。','home-approver')}
    ${type('#EEF4FF','#1F4FB8','list','Webダッシュボード','判断ログと経理向けの監査ビュー。読み取り専用。','web-event')}
    ${type('#F2F4F7','#1F2A37','bank','銀行の承認画面','お金を動かす最後の本人認証。KUROKOは操作しません。','bank')}
    ${type('#FEF3F2','#B42318','file','経費精算PDF','全員の振込が終わると、幹事のSlackに届きます。','pdf')}
  </div>
  <div class="sec-t">3つの鍵</div>
  <div class="keys">
    <div class="keyc"><span class="kn">1</span><div><b>本人の事前同意</b><span>出欠の回答時に上限額と銀行連携を許可（場面 02）</span></div></div>
    <div class="keyc"><span class="kn">2</span><div><b>按分方針の承認</b><span>規程で決まる1名が App Home で承認（場面 12）</span></div></div>
    <div class="keyc"><span class="kn">3</span><div><b>銀行での本人承認</b><span>お金を動かす最後の一押しは本人だけ（場面 13–14）</span></div></div>
  </div>
  <div class="sec-t">ストーリーの流れ</div>
  <div class="pw"><div class="tbl-wrap"><table class="tbl" style="min-width:600px">
    <thead><tr><th>#</th><th>場面</th><th>見ている人</th><th>画面</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div>`;
}

const VIEWS={overview:{group:'はじめに',label:'概要',html:overview}};
SC.forEach((s,i)=>{VIEWS['s'+pad(i+1)]={group:'ストーリー',sub:s.phase,n:pad(i+1),label:s.short,tag:s.branch?'分岐':s.surface.replace('DM＋モーダル','モーダル'),branch:s.branch,html:()=>storyPage(i)};});
Object.assign(VIEWS,{
  'home-approver':{group:'画面一覧',sub:'Slack App Home',label:'承認者（山田）',tag:'Home',html:()=>screenPage('Slack App Home','App Home（承認者）','承認待ちの一覧と、自分の支払い状況。承認の主な入口です（SPEC §7）。',slack({viewer:'yamada',tab:'ホーム',compose:false,feed:homeApprover()}))},
  'home-organizer':{group:'画面一覧',sub:'Slack App Home',label:'幹事（高橋）',tag:'Home',html:()=>screenPage('Slack App Home','App Home（幹事）','進行中のイベントと回収状況。10/31 20:13 時点（7件中5件が振込済み）の画面です。',slack({viewer:'takahashi',tab:'ホーム',compose:false,feed:homeOrganizer()}))},
  'home-participant':{group:'画面一覧',sub:'Slack App Home',label:'参加者（中村）',tag:'Home',html:()=>screenPage('Slack App Home','App Home（参加者）','自分の支払いと、参加予定のイベント。DMを見逃しても、ここから銀行での承認に進めます。',slack({viewer:'nakamura',tab:'ホーム',compose:false,feed:homeParticipant()}))},
  'web-events':{group:'画面一覧',sub:'Webダッシュボード',label:'イベント一覧',tag:'Web',html:()=>screenPage('Webダッシュボード','イベント一覧','総務・経理が会社全体のイベントと回収状況を見る画面。読み取り専用です。',webEvents())},
  'web-event':{group:'画面一覧',sub:'Webダッシュボード',label:'イベント詳細',tag:'Web',html:()=>screenPage('Webダッシュボード','イベント詳細','進み具合、参加者ごとの同意・負担額・振込状況、承認とガバナンスの状態をまとめて表示します。',webEvent())},
  'web-log':{group:'画面一覧',sub:'Webダッシュボード',label:'判断ログ',tag:'Web',html:()=>screenPage('Webダッシュボード','判断ログ','KUROKO の判断を時系列で追える画面。行を選ぶと、根拠と対応の詳細が右に出ます。',webLog())},
  'web-accounting':{group:'画面一覧',sub:'Webダッシュボード',label:'経理ビュー',tag:'Web',html:()=>screenPage('Webダッシュボード','経理ビュー','按分表・領収書・承認履歴・記録の項目を1画面にまとめた、経理向けの監査ビューです。',webAccounting())},
  'bank':{group:'画面一覧',sub:'その他',label:'銀行の承認画面',tag:'銀行',html:()=>screenPage('その他','銀行の承認画面','参加者が振込を承認する画面のイメージ（sunabar）。実際の画面とは異なります。',bankPage())},
  'pdf':{group:'画面一覧',sub:'その他',label:'経費精算PDF',tag:'PDF',html:()=>screenPage('その他','経費精算PDF','全員の振込完了後に作成し、幹事のSlackに届けるPDF（SPEC §9.5）。',pdfPage())}
});
const IDS=Object.keys(VIEWS);
let cur='overview';

function buildNav(){
  let h='',g='',sub='';
  IDS.forEach(id=>{
    const v=VIEWS[id];
    if(v.group!==g){g=v.group;sub='';h+=`<div class="nav-g">${g}</div>`;}
    if(v.sub&&v.sub!==sub){sub=v.sub;h+=`<div class="nav-sub">${sub}</div>`;}
    h+=`<button class="nav-i" data-go="${id}"${id===cur?' aria-current="page"':''}><span class="n">${v.n||''}</span><span class="t">${v.label}</span>${v.tag?`<span class="stag${v.branch?' br':''}">${v.tag}</span>`:''}</button>`;
  });
  document.getElementById('side').innerHTML=h;
  let o='',og='';
  IDS.forEach(id=>{
    const v=VIEWS[id];
    const grp=v.sub?`${v.group} ・ ${v.sub}`:v.group;
    if(grp!==og){if(og)o+='</optgroup>';og=grp;o+=`<optgroup label="${grp}">`;}
    o+=`<option value="${id}"${id===cur?' selected':''}>${v.n?v.n+' ':''}${v.label}</option>`;
  });
  document.getElementById('mnav-select').innerHTML=o+'</optgroup>';
}

function go(id,scroll){
  if(!VIEWS[id]) id='overview';
  cur=id;
  document.getElementById('view').innerHTML=VIEWS[id].html();
  buildNav();
  try{history.replaceState(null,'','#'+id);}catch(e){}
  if(scroll) window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go]');
  if(t&&!t.disabled) go(t.dataset.go,true);
});
document.getElementById('mnav-select').addEventListener('change',e=>go(e.target.value,true));
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey) return;
  const i=IDS.indexOf(cur);
  if(e.key==='ArrowRight'&&i<IDS.length-1) go(IDS[i+1],true);
  if(e.key==='ArrowLeft'&&i>0) go(IDS[i-1],true);
});

let start='overview';
try{const h=location.hash.slice(1); if(VIEWS[h]) start=h;}catch(e){}
go(start,false);
})();
</script>
