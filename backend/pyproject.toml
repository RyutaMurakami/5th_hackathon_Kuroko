[project]
name = "backend"
version = "0.1.0"
description = "AI agent backend (FastAPI + Google ADK)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-adk>=0.1.0",
    "google-genai>=0.5.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "google-cloud-tasks>=2.25.0",
    "slack-sdk>=3.44.1",
    "google-auth>=2.58.0",
    "aiohttp>=3.14.3",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "google-cloud-kms>=3.18.0",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
