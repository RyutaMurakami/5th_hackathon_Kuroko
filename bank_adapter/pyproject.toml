[project]
name = "bank-adapter"
version = "0.1.0"
description = "KUROKO bank-adapter: sunabar（銀行API）への窓口。トークンと口座の対応表を持つのはここだけ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "google-auth>=2.58.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-secret-manager>=2.20",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
